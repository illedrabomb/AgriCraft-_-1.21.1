# CodeQL security analysis. The triggers remain master-only; updating this
# integration branch cannot start a CI run by itself.
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '15 5 * * 6'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Java-only source analysis without Gradle autobuild. This avoids
      # invoking the separately gated NeoForge test/build tasks.
      # Generated/dependency code may be missed with build-mode none.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
