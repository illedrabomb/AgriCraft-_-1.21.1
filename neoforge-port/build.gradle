plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs {
        client { client(); gameDirectory = file('run/validation-client') }
        server { server(); gameDirectory = file('run/validation-server'); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
repositories { mavenCentral() }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testImplementation 'com.google.code.gson:gson:2.11.0'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
var metadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, neo_version: neo_version,
        minecraft_version_range: minecraft_version_range, loader_version_range: loader_version_range]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
