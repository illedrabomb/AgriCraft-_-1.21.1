plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            gameDirectory = file(project.hasProperty('playtest') ? 'run/playtest-client' : 'run/validation-client')
            if (project.hasProperty('playtest')) {
                programArgument '--quickPlayMultiplayer'
                programArgument '127.0.0.1:25589'
                programArgument '--width'
                programArgument '1280'
                programArgument '--height'
                programArgument '720'
            }
        }
        server { server(); gameDirectory = file(project.hasProperty('playtest') ? 'run/playtest-server' : 'run/validation-server'); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}
repositories {
    mavenCentral()
    // Optional JEI API only; the implementation remains an opt-in runtime mod.
    maven { url = uri('https://maven.blamejared.com') }
    // Optional Jade API for the native look-at tooltip integration.
    maven { url = uri('https://api.modrinth.com/maven') }
}
dependencies {
    // Compile against JEI's public API without embedding or loading JEI by default.
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.64.0.455'
    // Compile against Jade 1.21.1 only. It is NOT bundled or required at runtime.
    compileOnly 'maven.modrinth:jade:15.10.6+neoforge'
    // All supported local test mods can be loaded with -PloadTestMods.
    if (project.hasProperty('loadTestMods')) runtimeOnly fileTree(dir: 'test-mods', include: '*.jar')
    // Local, opt-in test dependency; never bundled or downloaded by a normal build.
    if (project.hasProperty('pamJar')) runtimeOnly files(project.property('pamJar'))
    // Optional local playtest-only HUD / recipe browsers. Never bundled
    // and never resolved as mandatory production dependencies.
    if (project.hasProperty('identifyJar')) runtimeOnly files(project.property('identifyJar'))
    if (project.hasProperty('jeiJar')) runtimeOnly files(project.property('jeiJar'))
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testImplementation 'com.google.code.gson:gson:2.11.0'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
var metadata = tasks.register('generateModMetadata', ProcessResources) {
    var props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, neo_version: neo_version,
        minecraft_version_range: minecraft_version_range, loader_version_range: loader_version_range]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
